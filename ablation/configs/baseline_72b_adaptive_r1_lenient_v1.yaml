# ADAPTIVE arm, skip branch = five round-1 analyses without round 2 (skip_mode round1_only;
# decisions.md 2026-10-07), otherwise identical to baseline_72b_adaptive_lenient_v1, whose text follows.
# Main experiment, ADAPTIVE arm, 72B (CLAUDE.md plan item 2; decisions.md 2026-10-06): the released
# 5-agent vote; if it is unanimous (vote_agreement >= 1.0) the single-agent plan step of the
# self-consistency arm (one round-1 analysis, round 2 skipped, released discriminator), otherwise the
# released debate unchanged. Same serving, parser and caps as baseline_72b_lenient_v1. Run once per
# original seed k with --reuse-chains <original seed k run> (vote logprobs on), so adaptive vs
# original is a paired comparison on identical chains. Threshold 1.0 = "clear vote" = unanimous; the
# offline replay (results.md 2026-10-06) predicts ~84% skipped, -0.4 points, -39% stage 6-7 tokens.
name: baseline_72b_adaptive_r1_lenient_v1
version: 1
created: "2026-10-07"

instances_file: swe-debate/utils/verified75.txt   # all 75: django 25, sympy 25, sphinx-doc 25
run:
  workers: 6

paths:
  # Full graphs (with code). Pre-build them on CPU first:
  #   python ablation/harness/build_full_graphs.py ablation/configs/shakeout10_localization_v1.yaml
  graph_index_dir: data/graphs_full
  results: ablation/results/baseline_72b_adaptive_r1_lenient_v1

serving:                        # how run_localization_job.sh must serve it (env vars); the run
                                # manifest records what was actually used
  weights: /projects/fypA3062models/Qwen2.5-72B-Instruct   # HDD tier (_hdd)
  commit: 495f39366efef23836d0cfae4fbe635880d2be31   # pinned
  weights_gb: 145
  gres: pro6000:2               # with -C highmem
  max_len: 65536                # SERVED_NAME=Qwen/Qwen2.5-72B-Instruct MAX_LEN=65536 ROPE_YARN=2 GPU_UTIL=0.95
  rope_yarn: 2                  # native context 32,768
  gpu_util: 0.95

llm:
  base_url: http://127.0.0.1:8765/v1      # overridden per job on EEE with --base-url
  model: Qwen/Qwen2.5-72B-Instruct
  timeout_seconds: 1200                  # larger model, longer generations

pipeline:
  lenient_json: true            # main-experiment parser setting (decisions.md 2026-10-04)
  arm:                          # decisions.md 2026-10-06
    name: adaptive
    trigger:
      signal: vote_agreement
      threshold: 1.0            # skip the debate only on a unanimous vote
    skip_mode: round1_only      # skip = released round 1 (5 agents) + discriminator, no round 2
  context: "context"
  max_initial_entities: 5
  max_depth: 5
  chain_embed_model: intfloat/multilingual-e5-large-instruct

instance_fields:
  keep: [instance_id, repo, base_commit, problem_statement]
