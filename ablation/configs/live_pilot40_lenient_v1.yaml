# PILOT of live_72b_lenient_v1: first 40 instances only.
# SWE-bench-Live (arXiv:2505.23419), plan item 3. DRAFT, not yet run.
# Dataset: SWE-bench-Live/SWE-bench-Live @ b51a86422e10cfd403beb4773e5a2947953e36ec, split
# "verified" (500), keeping instances created after 2024-09-19 00:00 (Qwen2.5 release date, a
# conservative stand-in for the backbone's unpublished training cutoff) whose gold patch touches a
# .py file: 388 instances from 96 repositories (2024-09-19 .. 2025-04-30). Build the dataset files
# on the machine that runs this (data/ is not in git):
#   python ablation/harness/swebench_live.py --split verified \
#       --revision b51a86422e10cfd403beb4773e5a2947953e36ec --created-after 2024-09-19
# then pre-build the graphs (build_graphs_job.sh with this config). Gold entities exist only for
# the 75-instance set, so Live is scored at file level. Backbone and serving settings copied from
# baseline_72b_lenient_v1 (the original arm with the main-experiment lenient parser, released caps).
name: live_pilot40_lenient_v1
version: 1
created: "2026-10-02"

dataset_file: data/swebench_live/live_verified_after_2024-09-19.json      # instance records
instances_file: data/swebench_live/live_verified_after_2024-09-19.ids.txt  # 388 instances
instances_slice: "0:40"       # pilot: the first 40 of the 388 (check clone size and graph time first)
run:
  workers: 6

paths:
  # Full graphs (with code). Pre-build them on CPU first:
  #   python ablation/harness/build_full_graphs.py ablation/configs/shakeout10_localization_v1.yaml
  graph_index_dir: data/graphs_live
  results: ablation/results/live_pilot40_lenient_v1

serving:                        # how run_localization_job.sh must serve it (env vars); the run
                                # manifest records what was actually used
  weights: /projects/fypA3062models/Qwen2.5-72B-Instruct   # HDD tier (_hdd)
  commit: 495f39366efef23836d0cfae4fbe635880d2be31   # pinned
  weights_gb: 145
  gres: pro6000:2               # with -C highmem
  max_len: 65536                # SERVED_NAME=Qwen/Qwen2.5-72B-Instruct MAX_LEN=65536 ROPE_YARN=2 GPU_UTIL=0.95
  rope_yarn: 2                  # native context 32,768
  gpu_util: 0.95

llm:
  base_url: http://127.0.0.1:8765/v1      # overridden per job on EEE with --base-url
  model: Qwen/Qwen2.5-72B-Instruct
  timeout_seconds: 1200                  # larger model, longer generations

pipeline:
  lenient_json: true            # main-experiment parser setting (decisions.md 2026-10-04)
  context: "context"
  max_initial_entities: 5
  max_depth: 5
  chain_embed_model: intfloat/multilingual-e5-large-instruct

instance_fields:
  keep: [instance_id, repo, base_commit, problem_statement]
