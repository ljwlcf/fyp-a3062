# Baseline, "as released" arm, 72B: Qwen2.5-72B @495f393 on all 75 SWE-Bench-Verified-S
# instances with exactly the settings of jobs 180343 + 180726: released JSON parser, released
# max_tokens caps, 64k context via YaRN, 2x pro6000 -C highmem, tensor parallel, released (fixed)
# chain order, 6 workers. One run per seed, set with the job's SEED env var (vLLM --seed).
# Seed 1 of this arm = jobs 180343 (backbone_trial_72b_v1, 10 instances) + 180726
# (backbone_trial_72b_rest65_v1, 65 instances), both served with vLLM seed 0.
# Seeds 2 and 3 run this config with SEED=2 / SEED=3. Conditional on the parser decision
# (decisions.md 2026-10-02).
name: baseline_72b_released_v1
version: 1
created: "2026-10-02"

instances_file: swe-debate/utils/verified75.txt   # all 75: django 25, sympy 25, sphinx-doc 25
run:
  workers: 6

paths:
  # Full graphs (with code). Pre-build them on CPU first:
  #   python ablation/harness/build_full_graphs.py ablation/configs/shakeout10_localization_v1.yaml
  graph_index_dir: data/graphs_full
  results: ablation/results/baseline_72b_released_v1

serving:                        # how run_localization_job.sh must serve it (env vars); the run
                                # manifest records what was actually used
  weights: /projects/fypA3062models/Qwen2.5-72B-Instruct   # HDD tier (_hdd)
  commit: 495f39366efef23836d0cfae4fbe635880d2be31   # pinned
  weights_gb: 145
  gres: pro6000:2               # with -C highmem
  max_len: 65536                # SERVED_NAME=Qwen/Qwen2.5-72B-Instruct MAX_LEN=65536 ROPE_YARN=2 GPU_UTIL=0.95
  rope_yarn: 2                  # native context 32,768
  gpu_util: 0.95

llm:
  base_url: http://127.0.0.1:8765/v1      # overridden per job on EEE with --base-url
  model: Qwen/Qwen2.5-72B-Instruct
  timeout_seconds: 1200                  # larger model, longer generations

pipeline:
  context: "context"
  max_initial_entities: 5
  max_depth: 5
  chain_embed_model: intfloat/multilingual-e5-large-instruct

instance_fields:
  keep: [instance_id, repo, base_commit, problem_statement]
